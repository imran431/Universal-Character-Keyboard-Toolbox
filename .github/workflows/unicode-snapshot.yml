name: Publish Unicode search snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Prepare authoritative Unicode snapshot
        run: npm run unicode:prepare

      - name: Verify snapshot payload
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('public/data/search/unicode-18.0-search.json','utf8'));if(p.unicodeVersion!=='18.0.0'||p.schemaVersion!==1)process.exit(1);"

      - name: Create checksum
        run: sha256sum public/data/search/unicode-18.0-search.json > public/data/search/unicode-18.0-search.json.sha256

      - name: Refuse to overwrite an existing pinned snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view unicode-18.0.0 >/dev/null 2>&1; then
            echo "Release unicode-18.0.0 already exists. Pinned Unicode snapshots are immutable."
            echo "Create a new versioned manifest and release tag for a replacement snapshot."
            exit 1
          fi

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create unicode-18.0.0 --title "Unicode 18.0.0 search snapshot" --notes "Deterministic browser search snapshot generated from the version-pinned Unicode 18.0.0 source manifest."
          gh release upload unicode-18.0.0 public/data/search/unicode-18.0-search.json public/data/search/unicode-18.0-search.json.sha256
