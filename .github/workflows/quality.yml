name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare authoritative Unicode search data
        run: npm run unicode:prepare

      - name: Build and type-check
        run: npm run build
        env:
          SITE_URL: http://localhost:4321

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive, SEO, and accessibility tests
        run: npx playwright test --project=mobile --project=desktop
